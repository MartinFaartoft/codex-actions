name: Deploy site

on:
  workflow_call:
    inputs:
      manifest_path:
        description: "Path to codex.yml in caller repo"
        type: string
        default: "codex.yml"
      dockerfile:
        description: "Path to Dockerfile in caller repo"
        type: string
        default: "Dockerfile"
      build_context:
        description: "Docker build context"
        type: string
        default: "."
    secrets:
      VPS_HOST:
        description: "VPS SSH hostname or IP"
        required: true
      VPS_SSH_PRIVATE_KEY:
        description: "Private key matching codex-deploy authorized_key on VPS"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: codex-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo curl -sL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Parse manifest
        id: manifest
        run: |
          set -euo pipefail
          MANIFEST="${{ inputs.manifest_path }}"
          [[ -f "$MANIFEST" ]] || { echo "::error::$MANIFEST not found"; exit 1; }

          SERVICE=$(yq -r '.service' "$MANIFEST")
          DOMAIN=$(yq -r '.domain' "$MANIFEST")
          PORT=$(yq -r '.port // 80' "$MANIFEST")
          TYPE=$(yq -r '.type // "static"' "$MANIFEST")
          EXTRA_DOMAINS=$(yq -r '.extra_domains // [] | join(",")' "$MANIFEST")
          HAS_DB=$(yq -r 'has("database")' "$MANIFEST")
          DB_TYPE=$(yq -r '.database.type // ""' "$MANIFEST")
          DB_VERSION=$(yq -r '.database.version // ""' "$MANIFEST")

          # Basic validation
          [[ "$SERVICE" =~ ^[a-z][a-z0-9-]{1,31}$ ]] || { echo "::error::invalid service name: $SERVICE"; exit 1; }
          [[ "$DOMAIN" =~ ^[a-z0-9.-]+$ ]] || { echo "::error::invalid domain: $DOMAIN"; exit 1; }
          [[ "$PORT" =~ ^[0-9]+$ ]] && [[ "$PORT" -gt 0 && "$PORT" -le 65535 ]] || { echo "::error::invalid port: $PORT"; exit 1; }
          [[ "$TYPE" == "static" || "$TYPE" == "app" ]] || { echo "::error::invalid type: $TYPE"; exit 1; }
          if [[ "$HAS_DB" == "true" ]]; then
            [[ "$DB_TYPE" == "postgres" ]] || { echo "::error::unsupported database.type: $DB_TYPE (only postgres)"; exit 1; }
            [[ "$DB_VERSION" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::invalid database.version: $DB_VERSION"; exit 1; }
            [[ "$TYPE" == "app" ]] || { echo "::error::database requires type: app"; exit 1; }
          fi
          if [[ -n "$EXTRA_DOMAINS" ]]; then
            IFS=',' read -ra _ARR <<< "$EXTRA_DOMAINS"
            for d in "${_ARR[@]}"; do
              [[ "$d" =~ ^[a-z0-9.-]+$ ]] || { echo "::error::invalid extra_domain: $d"; exit 1; }
            done
          fi

          echo "service=$SERVICE" >> "$GITHUB_OUTPUT"
          echo "domain=$DOMAIN"   >> "$GITHUB_OUTPUT"
          echo "port=$PORT"       >> "$GITHUB_OUTPUT"
          echo "type=$TYPE"       >> "$GITHUB_OUTPUT"
          echo "extra_domains=$EXTRA_DOMAINS" >> "$GITHUB_OUTPUT"
          echo "has_database=$HAS_DB"         >> "$GITHUB_OUTPUT"
          echo "db_version=$DB_VERSION"       >> "$GITHUB_OUTPUT"

          echo "::notice::deploying service=$SERVICE domain=$DOMAIN extra=$EXTRA_DOMAINS port=$PORT type=$TYPE db=$HAS_DB"

      - name: Compute image reference
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "$REPO"  | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=${SHA:0:12}
          TAG="ghcr.io/${OWNER_LC}/${REPO_LC}:sha-${SHORT_SHA}"
          LATEST="ghcr.io/${OWNER_LC}/${REPO_LC}:latest"
          echo "tag=$TAG"       >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render deploy artifacts
        id: render
        env:
          SERVICE: ${{ steps.manifest.outputs.service }}
          DOMAIN: ${{ steps.manifest.outputs.domain }}
          EXTRA_DOMAINS: ${{ steps.manifest.outputs.extra_domains }}
          PORT: ${{ steps.manifest.outputs.port }}
          TYPE: ${{ steps.manifest.outputs.type }}
          IMAGE: ${{ steps.image.outputs.tag }}
          HAS_DB: ${{ steps.manifest.outputs.has_database }}
          DB_VERSION: ${{ steps.manifest.outputs.db_version }}
        run: |
          set -euo pipefail

          if [[ "$HAS_DB" == "true" ]]; then
            COMPOSE=$(cat <<YAML
          services:
            ${SERVICE}:
              image: ${IMAGE}
              container_name: ${SERVICE}
              restart: unless-stopped
              networks:
                - web
                - internal
              expose:
                - "${PORT}"
              env_file:
                - .env
              environment:
                ASPNETCORE_URLS: "http://+:${PORT}"
                ConnectionStrings__Default: "Host=db;Port=5432;Database=${SERVICE};Username=${SERVICE};Password=\${DB_PASSWORD}"
              depends_on:
                db:
                  condition: service_healthy
              healthcheck:
                test: ["CMD", "curl", "-fsS", "http://localhost:${PORT}/healthz"]
                interval: 5s
                timeout: 3s
                retries: 12
                start_period: 10s
            db:
              image: postgres:${DB_VERSION}
              container_name: ${SERVICE}-db
              restart: unless-stopped
              networks:
                - internal
              env_file:
                - .env
              environment:
                POSTGRES_DB: ${SERVICE}
                POSTGRES_USER: ${SERVICE}
                POSTGRES_PASSWORD: \${DB_PASSWORD}
              volumes:
                - pgdata:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U ${SERVICE} -d ${SERVICE}"]
                interval: 5s
                timeout: 3s
                retries: 20

          networks:
            web:
              external: true
            internal:
              driver: bridge

          volumes:
            pgdata:
          YAML
          )
          else
            COMPOSE=$(cat <<YAML
          services:
            ${SERVICE}:
              image: ${IMAGE}
              container_name: ${SERVICE}
              restart: unless-stopped
              networks:
                - web
              expose:
                - "${PORT}"
              healthcheck:
                test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:${PORT}/"]
                interval: 5s
                timeout: 3s
                retries: 12
                start_period: 5s

          networks:
            web:
              external: true
          YAML
          )
          fi

          HOSTS="${DOMAIN}"
          if [[ -n "$EXTRA_DOMAINS" ]]; then
            HOSTS="${HOSTS}, ${EXTRA_DOMAINS//,/, }"
          fi

          CADDYFILE=$(cat <<CADDY
          ${HOSTS} {
            reverse_proxy ${SERVICE}:${PORT}
          }
          CADDY
          )

          COMPOSE_B64=$(printf '%s' "$COMPOSE" | base64 -w0)
          CADDY_B64=$(printf '%s' "$CADDYFILE" | base64 -w0)

          {
            echo "compose_b64=$COMPOSE_B64"
            echo "caddyfile_b64=$CADDY_B64"
          } >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Warm known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 10 "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            echo "ssh-keyscan attempt $i failed, retrying..."
            sleep 5
          done

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          SERVICE: ${{ steps.manifest.outputs.service }}
          DOMAIN: ${{ steps.manifest.outputs.domain }}
          PORT: ${{ steps.manifest.outputs.port }}
          TYPE: ${{ steps.manifest.outputs.type }}
          HAS_DB: ${{ steps.manifest.outputs.has_database }}
          IMAGE: ${{ steps.image.outputs.tag }}
          COMPOSE_B64: ${{ steps.render.outputs.compose_b64 }}
          CADDYFILE_B64: ${{ steps.render.outputs.caddyfile_b64 }}
        run: |
          set -euo pipefail

          HAS_DB_JSON=false
          [[ "$HAS_DB" == "true" ]] && HAS_DB_JSON=true

          PAYLOAD=$(jq -n \
            --arg service "$SERVICE" \
            --arg image "$IMAGE" \
            --arg domain "$DOMAIN" \
            --argjson port "$PORT" \
            --arg type "$TYPE" \
            --argjson has_database "$HAS_DB_JSON" \
            --arg compose "$COMPOSE_B64" \
            --arg caddyfile "$CADDYFILE_B64" \
            '{version:1, service:$service, image:$image, domain:$domain, port:$port, type:$type, has_database:$has_database, compose:$compose, caddyfile:$caddyfile}')

          echo "$PAYLOAD" | jq -c 'del(.compose, .caddyfile) + {compose:"<b64>", caddyfile:"<b64>"}'

          echo "$PAYLOAD" | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes deploy@"$VPS_HOST"

      - name: Summary
        if: always()
        env:
          SERVICE: ${{ steps.manifest.outputs.service }}
          DOMAIN: ${{ steps.manifest.outputs.domain }}
          IMAGE: ${{ steps.image.outputs.tag }}
        run: |
          {
            echo "### Codex deploy"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| service | \`$SERVICE\` |"
            echo "| domain  | \`$DOMAIN\` |"
            echo "| image   | \`$IMAGE\` |"
            echo "| status  | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
